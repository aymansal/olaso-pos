name: Android signed release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Decode upload keystore
        env:
          OLASO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.OLASO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$OLASO_UPLOAD_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/olaso-signing"
          printf '%s' "$OLASO_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/olaso-signing/upload.jks"
          echo "OLASO_UPLOAD_STORE_FILE=$RUNNER_TEMP/olaso-signing/upload.jks" >> "$GITHUB_ENV"

      - name: Configure signing env
        env:
          OLASO_UPLOAD_STORE_PASSWORD: ${{ secrets.OLASO_UPLOAD_STORE_PASSWORD }}
          OLASO_UPLOAD_KEY_ALIAS: ${{ secrets.OLASO_UPLOAD_KEY_ALIAS }}
          OLASO_UPLOAD_KEY_PASSWORD: ${{ secrets.OLASO_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$OLASO_UPLOAD_STORE_PASSWORD"
          test -n "$OLASO_UPLOAD_KEY_ALIAS"
          test -n "$OLASO_UPLOAD_KEY_PASSWORD"
          {
            echo "OLASO_UPLOAD_STORE_PASSWORD=$OLASO_UPLOAD_STORE_PASSWORD"
            echo "OLASO_UPLOAD_KEY_ALIAS=$OLASO_UPLOAD_KEY_ALIAS"
            echo "OLASO_UPLOAD_KEY_PASSWORD=$OLASO_UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Check release contracts
        run: npm run check:release

      - name: Build signed release APK
        run: npm run android:release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: olaso-pos-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
