<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=1340, user-scalable=no"
    />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#F8F7EA" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #F8F7EA; }
      .olaso-startup {
        display: grid;
        min-height: 100vh;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #006A2B;
        text-align: center;
        background: #F8F7EA;
      }
      .olaso-startup-logo { display: block; width: 320px; height: auto; }
    </style>
    <title>Olaso POS</title>
  </head>
  <body>
    <div id="root">
      <main
        class="olaso-startup"
        data-olaso-startup="document"
        aria-label="Loading Olaso"
        aria-busy="true"
        role="status"
      >
        <img
          class="olaso-startup-logo"
          src="/assets/brand/olaso-wordmark-operational-green-transparent.png"
          alt="OLASO"
          width="320"
          height="87"
        />
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="4" cy="12" r="2" fill="currentColor"><animate id="olaso_startup_first" begin="0;olaso_startup_last.end+0.25s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12" keySplines=".33,.66,.66,1;.33,0,.66,.33" /></circle>
          <circle cx="12" cy="12" r="2" fill="currentColor"><animate begin="olaso_startup_first.begin+0.1s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12" keySplines=".33,.66,.66,1;.33,0,.66,.33" /></circle>
          <circle cx="20" cy="12" r="2" fill="currentColor"><animate id="olaso_startup_last" begin="olaso_startup_first.begin+0.2s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12" keySplines=".33,.66,.66,1;.33,0,.66,.33" /></circle>
        </svg>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
