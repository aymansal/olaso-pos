<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=1340, user-scalable=no"
    />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#F8F7EA" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #F8F7EA; }
      .olaso-startup {
        --olaso-comet-size: 24px;
        display: grid;
        min-height: 100vh;
        place-content: center;
        justify-items: center;
        gap: 18px;
        color: #006A2B;
        text-align: center;
        background: #F8F7EA;
      }
      .olaso-startup::before { content: ''; width: var(--olaso-comet-size); height: var(--olaso-comet-size); }
      .olaso-startup-logo { display: block; width: 225px; height: auto; }
      .olaso-comet {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--olaso-comet-size);
        height: var(--olaso-comet-size);
        --olaso-comet-head: calc(var(--olaso-comet-size) * 0.2);
        --olaso-comet-radius: calc(var(--olaso-comet-size) * 0.83);
      }
      .olaso-comet-body {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        /* Fixed comet trail; only the rotation animates, so the sweep is
           steady and never retracts back to its starting point. */
        box-shadow:
          0 calc(var(--olaso-comet-radius) * -1) 0 calc(var(--olaso-comet-head) * -2),
          calc(var(--olaso-comet-radius) * -0.454) calc(var(--olaso-comet-radius) * -0.892) 0 calc(var(--olaso-comet-head) * -2.1),
          calc(var(--olaso-comet-radius) * -0.777) calc(var(--olaso-comet-radius) * -0.629) 0 calc(var(--olaso-comet-head) * -2.2),
          calc(var(--olaso-comet-radius) * -0.934) calc(var(--olaso-comet-radius) * -0.358) 0 calc(var(--olaso-comet-head) * -2.3),
          calc(var(--olaso-comet-radius) * -0.988) calc(var(--olaso-comet-radius) * -0.108) 0 calc(var(--olaso-comet-head) * -2.385);
        animation: olaso-comet-rotation 3.4s linear infinite;
        transform: translateZ(0);
      }
      @keyframes olaso-comet-rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) { .olaso-comet-body { animation: none; } }
    </style>
    <title>Atelika POS</title>
  </head>
  <body>
    <div id="root">
      <main
        class="olaso-startup"
        data-olaso-startup="document"
        aria-label="Loading Atelika"
        aria-busy="true"
        role="status"
      >
        <img
          class="olaso-startup-logo"
          src="/assets/brand/atelika-wordmark-transparent.png"
          alt="Atelika"
          width="225"
          height="71"
        />
        <span class="olaso-comet" aria-hidden="true">
          <span class="olaso-comet-body"></span>
        </span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
